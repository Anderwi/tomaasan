<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nevro-Tegning (102 min)</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #03dac6;
            --frozen-color: #cf6679;
            --pause-color: #ffb74d;
            --gold-color: #ffd700;
            --twist-bg: #2d1318; 
            --twist-accent: #ff5252;
            --emergency-bg: #0d1b2a; 
            --emergency-accent: #77aaff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            transition: background-color 0.5s ease;
        }
        
        /* Hovedmeny */
        #menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 450px;
            overflow-y: auto;
            padding-bottom: 30px;
        }
        
        /* Grid-system for å tvinge alle knapper til nøyaktig lik høyde */
        #menu-buttons {
            display: grid;
            grid-template-columns: 1fr;
            grid-auto-rows: 1fr; 
            gap: 15px;
        }
        
        .block-btn {
            background-color: #2c2c2c;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            height: 100%; /* Fyller hele grid-cellen */
        }
        .block-btn:hover { background-color: #3d3d3d; }
        .block-btn:active { transform: scale(0.98); }
        .btn-title { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); margin-bottom: 5px; }
        .btn-desc { font-size: 0.9rem; color: #aaa; margin-bottom: 8px; line-height: 1.4; flex-grow: 1; }
        .btn-pauses { font-size: 0.8rem; color: #888; font-style: italic; margin-top: auto; }

        /* Timer UI */
        #timer-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 450px;
        }
        #block-name {
            font-size: 1.4rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            font-weight: bold;
        }
        #block-info-display {
            font-size: 0.95rem;
            color: #aaa;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        /* Fotoreferanse Styling */
        #reference-image-container {
            display: none;
            position: relative;
            width: 100%;
            height: 200px;
            margin: 10px 0;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #444;
            background-color: #000;
            cursor: pointer; /* Viser at den kan trykkes på */
        }
        #reference-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .upside-down {
            transform: rotate(180deg);
        }
        .image-hint {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0,0,0,0.6);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            pointer-events: none; /* Lar klikket gå gjennom til bildet */
        }
        
        #twist-alert {
            display: none;
            background-color: rgba(255, 82, 82, 0.15);
            border: 2px solid var(--twist-accent);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: center;
            animation: pulse 2s infinite;
            font-size: 0.9rem;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 82, 82, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 82, 82, 0); }
        }

        #timer-display {
            font-size: 5rem;
            font-weight: bold;
            margin: 10px 0;
            font-variant-numeric: tabular-nums;
        }
        #status-text {
            font-size: 1.5rem;
            height: 2rem;
            margin-bottom: 30px;
            font-weight: 300;
            text-align: center;
        }
        
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        .control-btn {
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex: 1 1 30%; 
            min-width: 100px;
        }
        #pause-btn { background-color: var(--pause-color); color: #000; }
        
        #emergency-btn {
            background-color: transparent;
            color: var(--emergency-accent);
            border: 1px solid var(--emergency-accent);
            box-shadow: none;
        }
        
        #cancel-btn {
            background-color: transparent;
            color: #888;
            border: 1px solid #555;
            box-shadow: none;
        }

        .frozen { background-color: #2c1a1d !important; }
        .frozen #status-text { color: var(--frozen-color); font-weight: bold; }
        .paused { background-color: #1f1b13 !important; }
        
        body.twist-active { background-color: var(--twist-bg); }
        body.twist-active #block-name { color: var(--twist-accent); }
        
        body.emergency-mode { background-color: var(--emergency-bg) !important; }
        body.emergency-mode #block-name { color: var(--emergency-accent) !important; }
        body.emergency-mode #block-info-display { color: #fff; }
        
        #reward-display {
            font-size: 1.3rem;
            height: 3rem;
            margin-top: 30px;
            text-align: center;
            font-weight: bold;
        }
        .reward-none { color: #888; }
        .reward-small { color: #bb86fc; }
        .reward-big { color: var(--gold-color); font-size: 1.5rem !important; text-transform: uppercase; }
    </style>
</head>
<body>

    <!-- Hovedmeny -->
    <div id="menu-container">
        <h2 style="text-align: center; color: var(--accent-color); margin-bottom: 20px;">Dagens Økter (102 min)</h2>
        <div id="menu-buttons"></div>
        <div id="reward-display"></div>
    </div>

    <!-- Timer Skjerm -->
    <div id="timer-container">
        <div id="block-name">Blokk Navn</div>
        <div id="block-info-display">Info om blokken</div>
