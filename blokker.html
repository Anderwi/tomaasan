<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nevro-Tegning</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #03dac6;
            --frozen-color: #cf6679;
            --pause-color: #ffb74d;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.3s;
        }
        /* Hovedmeny */
        #menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 400px;
        }
        .block-btn {
            background-color: #2c2c2c;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 20px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .block-btn:hover { background-color: #3d3d3d; }
        .block-btn:active { transform: scale(0.98); }

        /* Timer UI */
        #timer-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        #block-name {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #timer-display {
            font-size: 6rem;
            font-weight: bold;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }
        #status-text {
            font-size: 2rem;
            height: 2.5rem;
            margin-bottom: 40px;
            font-weight: 300;
        }
        
        .controls {
            display: flex;
            gap: 15px;
        }
        .control-btn {
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #pause-btn {
            background-color: var(--pause-color);
            color: #000;
        }
        #cancel-btn {
            background-color: transparent;
            color: #888;
            border: 1px solid #555;
            box-shadow: none;
        }

        .frozen { background-color: #2c1a1d !important; }
        .frozen #status-text { color: var(--frozen-color); font-weight: bold; }
        .paused { background-color: #1f1b13 !important; }
        
        #reward-display {
            font-size: 1.5rem;
            color: #bb86fc;
            height: 2rem;
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Hovedmeny -->
    <div id="menu-container">
        <h2 style="text-align: center; color: var(--accent-color); margin-bottom: 30px;">Dagens Økter</h2>
        <button class="block-btn" onclick="startBlock('Blokk 1: Perspektiv & Form')">Blokk 1: Perspektiv & Form</button>
        <button class="block-btn" onclick="startBlock('Blokk 2: Kompleks Form')">Blokk 2: Kompleks Form</button>
        <button class="block-btn" onclick="startBlock('Blokk 3: Anatomi')">Blokk 3: Anatomi</button>
        <button class="block-btn" onclick="startBlock('Blokk 4: Lys & Skygge')">Blokk 4: Lys & Skygge</button>
        <div id="reward-display"></div>
    </div>

    <!-- Timer Skjerm -->
    <div id="timer-container">
        <div id="block-name">Blokk Navn</div>
        <div id="timer-display">20:00</div>
        <div id="status-text">Klar til start</div>
        <div class="controls">
            <button id="pause-btn" class="control-btn" onclick="togglePause()">Pause</button>
            <button id="cancel-btn" class="control-btn" onclick="cancelBlock()">Avbryt</button>
        </div>
    </div>

    <script>
        // Innstillinger
        const ACTIVE_TIME_SEC = 20 * 60; 
        const PAUSE_TIME_SEC = 10;       
        const NUM_PAUSES = 8;            
        const WIN_CHANCE = 0.25;         
        
        // Tilstandsvariabler
        let activeTimeLeft = ACTIVE_TIME_SEC;
        let pauseTimeLeft = PAUSE_TIME_SEC;
        let isFrozen = false;
        let isUserPaused = false;
        let timerInterval = null;
        let pauseTriggers = [];
        let wakeLock = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playStopSound() { playTone(800, 'square', 0.3, 0.1); }
        function playStartSound() {
            playTone(400, 'sine', 0.2, 0.1);
            setTimeout(() => playTone(600, 'sine', 0.4, 0.1), 150);
        }
        function playWinSound() {
            playTone(400, 'triangle', 0.1, 0.2);
            setTimeout(() => playTone(500, 'triangle', 0.1, 0.2), 100);
            setTimeout(() => playTone(600, 'triangle', 0.4, 0.2), 200);
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { console.log("WakeLock feilet: " + err.name); }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        function generatePauses() {
            let pauses = [];
            while(pauses.length < NUM_PAUSES) {
                let p = Math.floor(Math.random() * (ACTIVE_TIME_SEC - 120)) + 60;
                let collision = pauses.some(existing => Math.abs(existing - p) < 45);
                if(!collision) pauses.push(p);
            }
            return pauses.sort((a, b) => b - a);
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateUI() {
            if (isUserPaused) {
                document.getElementById('status-text').innerText = "Satt på pause";
                document.body.classList.add('paused');
                document.body.classList.remove('frozen');
                return;
            }
            
            document.body.classList.remove('paused');
            
            if(isFrozen) {
                document.getElementById('timer-display').innerText = `00:${pauseTimeLeft.toString().padStart(2, '0')}`;
                document.getElementById('status-text').innerText = "SLIPP PENNEN!";
                document.body.classList.add('frozen');
            } else {
                document.getElementById('timer-display').innerText = formatTime(activeTimeLeft);
                document.getElementById('status-text').innerText = "Tegn!";
                document.body.classList.remove('frozen');
            }
        }

        function startBlock(blockName) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            requestWakeLock();
            
            document.getElementById('block-name').innerText = blockName;
            document.getElementById('menu-container').style.display = "none";
            document.getElementById('timer-container').style.display = "flex";
            document.getElementById('reward-display').innerText = "";
            
            activeTimeLeft = ACTIVE_TIME_SEC;
            pauseTimeLeft = PAUSE_TIME_SEC;
            isFrozen = false;
            isUserPaused = false;
            pauseTriggers = generatePauses();
            
            updateUI();
            timerInterval = setInterval(tick, 1000);
        }

        function togglePause() {
            isUserPaused = !isUserPaused;
            let pauseBtn = document.getElementById('pause-btn');
            
            if (isUserPaused) {
                clearInterval(timerInterval);
                releaseWakeLock();
                pauseBtn.innerText = "Gjenoppta";
                pauseBtn.style.backgroundColor = "var(--accent-color)";
            } else {
                requestWakeLock();
                pauseBtn.innerText = "Pause";
                pauseBtn.style.backgroundColor = "var(--pause-color)";
                timerInterval = setInterval(tick, 1000);
            }
            updateUI();
        }

        function cancelBlock() {
            clearInterval(timerInterval);
            releaseWakeLock();
            document.body.classList.remove('frozen', 'paused');
            document.getElementById('timer-container').style.display = "none";
            document.getElementById('menu-container').style.display = "flex";
            
            // Tilbakestill pause-knappen hvis den var satt på pause
            let pauseBtn = document.getElementById('pause-btn');
            pauseBtn.innerText = "Pause";
            pauseBtn.style.backgroundColor = "var(--pause-color)";
        }

        function finishBlock() {
            cancelBlock(); // Deler samme logikk for å rydde opp og gå til menyen
            
            // Lotteri-logikk kjøres kun ved fullført blokk
            if(Math.random() < WIN_CHANCE) {
                playWinSound();
                document.getElementById('reward-display').innerText = "🎉 DU VANT EN BELØNNING! 🎉";
            } else {
                document.getElementById('reward-display').innerText = "Ingen belønning denne gangen.";
            }
        }

        function tick() {
            if(isFrozen) {
                pauseTimeLeft--;
                if(pauseTimeLeft <= 0) {
                    isFrozen = false;
                    pauseTimeLeft = PAUSE_TIME_SEC;
                    playStartSound();
                }
            } else {
                activeTimeLeft--;
                if(pauseTriggers.length > 0 && activeTimeLeft === pauseTriggers[0]) {
                    pauseTriggers.shift();
                    isFrozen = true;
                    playStopSound();
                } else if(activeTimeLeft <= 0) {
                    finishBlock();
                }
            }
            updateUI();
        }
    </script>
</body>
</html>
