<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nevro-Tegning (120 min)</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #03dac6;
            --frozen-color: #cf6679;
            --pause-color: #ffb74d;
            --gold-color: #ffd700;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            transition: background-color 0.3s;
        }
        
        /* Hovedmeny */
        #menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 450px;
            overflow-y: auto;
            padding-bottom: 30px;
        }
        .block-btn {
            background-color: #2c2c2c;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s, transform 0.1s;
        }
        .block-btn:hover { background-color: #3d3d3d; }
        .block-btn:active { transform: scale(0.98); }
        .btn-title { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); margin-bottom: 5px; }
        .btn-desc { font-size: 0.9rem; color: #aaa; margin-bottom: 8px; line-height: 1.4; }
        .btn-pauses { font-size: 0.8rem; color: #888; font-style: italic; }

        /* Timer UI */
        #timer-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
        }
        #block-name {
            font-size: 1.4rem;
            color: var(--accent-color);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            font-weight: bold;
        }
        #block-info-display {
            font-size: 0.95rem;
            color: #aaa;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        #timer-display {
            font-size: 6rem;
            font-weight: bold;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }
        #status-text {
            font-size: 2rem;
            height: 2.5rem;
            margin-bottom: 40px;
            font-weight: 300;
            text-align: center;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }
        .control-btn {
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex: 1;
            max-width: 150px;
        }
        #pause-btn { background-color: var(--pause-color); color: #000; }
        #cancel-btn {
            background-color: transparent;
            color: #888;
            border: 1px solid #555;
            box-shadow: none;
        }

        .frozen { background-color: #2c1a1d !important; }
        .frozen #status-text { color: var(--frozen-color); font-weight: bold; }
        .paused { background-color: #1f1b13 !important; }
        
        #reward-display {
            font-size: 1.3rem;
            height: 3rem;
            margin-top: 30px;
            text-align: center;
            font-weight: bold;
        }
        .reward-none { color: #888; }
        .reward-small { color: #bb86fc; }
        .reward-big { color: var(--gold-color); font-size: 1.5rem !important; text-transform: uppercase; }
    </style>
</head>
<body>

    <!-- Hovedmeny -->
    <div id="menu-container">
        <h2 style="text-align: center; color: var(--accent-color); margin-bottom: 20px;">Dagens Økter (120 min)</h2>
        <!-- Knappene genereres automatisk via JavaScript -->
        <div id="menu-buttons"></div>
        <div id="reward-display"></div>
    </div>

    <!-- Timer Skjerm -->
    <div id="timer-container">
        <div id="block-name">Blokk Navn</div>
        <div id="block-info-display">Info om blokken</div>
        <div id="timer-display">20:00</div>
        <div id="status-text">Klar til start</div>
        <div class="controls">
            <button id="pause-btn" class="control-btn" onclick="togglePause()">Pause</button>
            <button id="cancel-btn" class="control-btn" onclick="cancelBlock()">Avbryt</button>
        </div>
    </div>

    <script>
        // Innstillinger for blokkene
        const blocksConfig = [
            { id: 1, title: 'Blokk 1: Perspektiv & Form', desc: 'Tegn primitive volumer (bokser, sylindere, kuler) i fri rotasjon. Bruk røntgensyn.', pauses: 10 },
            { id: 2, title: 'Blokk 2: Anatomi & Konstruksjon', desc: 'Bruk de primitive formene til å bygge forenklede 3D-mannekenger. Fokus på proporsjoner.', pauses: 6 },
            { id: 3, title: 'Blokk 3: Kryssende & Bøyde former', desc: 'La formene kollidere (f.eks. sylinder gjennom kule) eller deformeres (bøyd boks).', pauses: 5 },
            { id: 4, title: 'Blokk 4: Lys & Skygge', desc: 'Plasser en tydelig lyskilde og skyggelegg primitive former med skravering.', pauses: 12 },
            { id: 5, title: 'Blokk 5: Dekonstruksjon', desc: 'Finn en fotoreferanse. Dekonstruer motivet utelukkende til gjennomsiktige 3D-blokker.', pauses: 6 },
            { id: 6, title: 'Blokk 6: Integrasjon', desc: 'Tegn dynamiske posisjoner fra referanse, bygget bunnsolid opp med 3D-volumer.', pauses: 6 }
        ];

        const ACTIVE_TIME_SEC = 20 * 60; // 20 minutter
        const PAUSE_TIME_SEC = 10;       // 10 sekunder
        
        // Tilstandsvariabler
        let activeTimeLeft = ACTIVE_TIME_SEC;
        let pauseTimeLeft = PAUSE_TIME_SEC;
        let isFrozen = false;
        let isUserPaused = false;
        let timerInterval = null;
        let pauseTriggers = [];
        let wakeLock = null;

        // Bygg hovedmenyen dynamisk
        const menuDiv = document.getElementById('menu-buttons');
        blocksConfig.forEach(block => {
            const btn = document.createElement('button');
            btn.className = 'block-btn';
            btn.onclick = () => startBlock(block);
            btn.innerHTML = `
                <div class="btn-title">${block.title}</div>
                <div class="btn-desc">${block.desc}</div>
                <div class="btn-pauses">⏱️ Inneholder ${block.pauses} tilfeldige mikropauser</div>
            `;
            menuDiv.appendChild(btn);
        });

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playStopSound() { playTone(800, 'square', 0.3, 0.1); }
        function playStartSound() {
            playTone(400, 'sine', 0.2, 0.1);
            setTimeout(() => playTone(600, 'sine', 0.4, 0.1), 150);
        }
        function playWinSound(isBig) {
            playTone(400, 'triangle', 0.1, 0.2);
            setTimeout(() => playTone(500, 'triangle', 0.1, 0.2), 100);
            setTimeout(() => playTone(600, 'triangle', 0.4, 0.2), 200);
            if(isBig) {
                setTimeout(() => playTone(800, 'triangle', 0.6, 0.2), 400);
            }
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { console.log("WakeLock feilet: " + err.name); }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        function generatePauses(numPauses) {
            let pauses = [];
            let attempts = 0;
            // Legger inn en attempts-sperre for å forhindre uendelig loop
            while(pauses.length < numPauses && attempts < 1000) {
                attempts++;
                let p = Math.floor(Math.random() * (ACTIVE_TIME_SEC - 120)) + 60;
                let collision = pauses.some(existing => Math.abs(existing - p) < 45); // Minst 45 sek buffer
                if(!collision) pauses.push(p);
            }
            return pauses.sort((a, b) => b - a);
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateUI() {
            if (isUserPaused) {
                document.getElementById('status-text').innerText = "Satt på pause";
                document.body.classList.add('paused');
                document.body.classList.remove('frozen');
                return;
            }
            
            document.body.classList.remove('paused');
            
            if(isFrozen) {
                document.getElementById('timer-display').innerText = `00:${pauseTimeLeft.toString().padStart(2, '0')}`;
                document.getElementById('status-text').innerText = "SLIPP PENNEN!";
                document.body.classList.add('frozen');
            } else {
                document.getElementById('timer-display').innerText = formatTime(activeTimeLeft);
                document.getElementById('status-text').innerText = "Tegn!";
                document.body.classList.remove('frozen');
            }
        }

        function startBlock(block) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            requestWakeLock();
            
            document.getElementById('block-name').innerText = block.title;
            document.getElementById('block-info-display').innerText = `${block.desc} (${block.pauses} pauser)`;
            
            document.getElementById('menu-container').style.display = "none";
            document.getElementById('timer-container').style.display = "flex";
            
            const rewardDisplay = document.getElementById('reward-display');
            rewardDisplay.innerText = "";
            rewardDisplay.className = "";
            
            activeTimeLeft = ACTIVE_TIME_SEC;
            pauseTimeLeft = PAUSE_TIME_SEC;
            isFrozen = false;
            isUserPaused = false;
            pauseTriggers = generatePauses(block.pauses);
            
            updateUI();
            timerInterval = setInterval(tick, 1000);
        }

        function togglePause() {
            isUserPaused = !isUserPaused;
            let pauseBtn = document.getElementById('pause-btn');
            
            if (isUserPaused) {
                clearInterval(timerInterval);
                releaseWakeLock();
                pauseBtn.innerText = "Gjenoppta";
                pauseBtn.style.backgroundColor = "var(--accent-color)";
            } else {
                requestWakeLock();
                pauseBtn.innerText = "Pause";
                pauseBtn.style.backgroundColor = "var(--pause-color)";
                timerInterval = setInterval(tick, 1000);
            }
            updateUI();
        }

        function cancelBlock() {
            clearInterval(timerInterval);
            releaseWakeLock();
            document.body.classList.remove('frozen', 'paused');
            document.getElementById('timer-container').style.display = "none";
            document.getElementById('menu-container').style.display = "flex";
            
            let pauseBtn = document.getElementById('pause-btn');
            pauseBtn.innerText = "Pause";
            pauseBtn.style.backgroundColor = "var(--pause-color)";
        }

        function finishBlock() {
            cancelBlock(); 
            
            // Lotteri (1% stor premie, 20% liten premie)
            const rand = Math.random();
            const rewardDisplay = document.getElementById('reward-display');
            
            if(rand <= 0.01) {
                playWinSound(true);
                rewardDisplay.innerText = "🏆 DU VANT EN STOR PREMIE! 🏆";
                rewardDisplay.className = "reward-big";
            } else if(rand <= 0.21) {
                playWinSound(false);
                rewardDisplay.innerText = "🎉 DU VANT EN LITEN PREMIE! 🎉";
                rewardDisplay.className = "reward-small";
            } else {
                rewardDisplay.innerText = "Ingen belønning denne gangen.";
                rewardDisplay.className = "reward-none";
            }
        }

        function tick() {
            if(isFrozen) {
                pauseTimeLeft--;
                if(pauseTimeLeft <= 0) {
                    isFrozen = false;
                    pauseTimeLeft = PAUSE_TIME_SEC;
                    playStartSound();
                }
            } else {
                activeTimeLeft--;
                if(pauseTriggers.length > 0 && activeTimeLeft === pauseTriggers[0]) {
                    pauseTriggers.shift();
                    isFrozen = true;
                    playStopSound();
                } else if(activeTimeLeft <= 0) {
                    finishBlock();
                }
            }
            updateUI();
        }
    </script>
</body>
</html>
