<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nevro-Tegning</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #03dac6;
            --frozen-color: #cf6679;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.3s;
        }
        #block-name {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #timer-display {
            font-size: 6rem;
            font-weight: bold;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }
        #status-text {
            font-size: 2rem;
            height: 2.5rem;
            margin-bottom: 40px;
            font-weight: 300;
        }
        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        button:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }
        .frozen {
            background-color: #2c1a1d !important;
        }
        .frozen #status-text {
            color: var(--frozen-color);
            font-weight: bold;
        }
        #reward-display {
            font-size: 1.5rem;
            color: #bb86fc;
            height: 2rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="block-name">Blokk 1 / 4</div>
    <div id="timer-display">20:00</div>
    <div id="status-text">Klar til start</div>
    <button id="start-btn">Start Blokk</button>
    <div id="reward-display"></div>

    <script>
        // Innstillinger
        const ACTIVE_TIME_SEC = 20 * 60; // 20 minutter
        const PAUSE_TIME_SEC = 10;       // 10 sekunders mikropause
        const NUM_PAUSES = 8;            // Antall pauser per blokk
        const WIN_CHANCE = 0.25;         // 25% sjanse for belønning
        
        // Tilstandsvariabler
        let currentBlock = 1;
        let activeTimeLeft = ACTIVE_TIME_SEC;
        let pauseTimeLeft = PAUSE_TIME_SEC;
        let isFrozen = false;
        let timerInterval = null;
        let pauseTriggers = [];
        let wakeLock = null;

        // Lydmotor (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playStopSound() {
            // Skarpt, irriterende signal for å bryte fokus (Noradrenalin)
            playTone(800, 'square', 0.3, 0.1);
        }

        function playStartSound() {
            // Mykt, oppadgående signal
            playTone(400, 'sine', 0.2, 0.1);
            setTimeout(() => playTone(600, 'sine', 0.4, 0.1), 150);
        }

        function playWinSound() {
            playTone(400, 'triangle', 0.1, 0.2);
            setTimeout(() => playTone(500, 'triangle', 0.1, 0.2), 100);
            setTimeout(() => playTone(600, 'triangle', 0.4, 0.2), 200);
        }

        // Hindre at skjermen slukker (Doze Mode)
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("WakeLock feilet: " + err.name);
            }
        }
        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }
        }

        // Generer tilfeldige pauser (Anti-kollisjon: Minst 45 sek mellomrom)
        function generatePauses() {
            let pauses = [];
            while(pauses.length < NUM_PAUSES) {
                let p = Math.floor(Math.random() * (ACTIVE_TIME_SEC - 120)) + 60; // Mellom min 1 og 19
                let collision = pauses.some(existing => Math.abs(existing - p) < 45);
                if(!collision) pauses.push(p);
            }
            return pauses.sort((a, b) => b - a); // Sorter synkende for lettere uttrekk
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateUI() {
            document.getElementById('block-name').innerText = `Blokk ${currentBlock} / 4`;
            if(isFrozen) {
                document.getElementById('timer-display').innerText = `00:${pauseTimeLeft.toString().padStart(2, '0')}`;
                document.getElementById('status-text').innerText = "SLIPP PENNEN!";
                document.body.classList.add('frozen');
            } else {
                document.getElementById('timer-display').innerText = formatTime(activeTimeLeft);
                document.getElementById('status-text').innerText = "Tegn!";
                document.body.classList.remove('frozen');
            }
        }

        function finishBlock() {
            clearInterval(timerInterval);
            releaseWakeLock();
            document.getElementById('status-text').innerText = "Blokk ferdig";
            document.getElementById('start-btn').style.display = "block";
            
            // Lotteri
            if(Math.random() < WIN_CHANCE) {
                playWinSound();
                document.getElementById('reward-display').innerText = "🎉 DU VANT EN BELØNNING! 🎉";
            } else {
                document.getElementById('reward-display').innerText = "Ingen belønning denne gangen.";
            }

            currentBlock++;
            if(currentBlock > 4) {
                document.getElementById('start-btn').style.display = "none";
                document.getElementById('block-name').innerText = "Økt fullført";
            }
        }

        function tick() {
            if(isFrozen) {
                pauseTimeLeft--;
                if(pauseTimeLeft <= 0) {
                    isFrozen = false;
                    pauseTimeLeft = PAUSE_TIME_SEC;
                    playStartSound();
                }
            } else {
                activeTimeLeft--;
                // Sjekk om vi treffer en pause
                if(pauseTriggers.length > 0 && activeTimeLeft === pauseTriggers[0]) {
                    pauseTriggers.shift(); // Fjern triggern
                    isFrozen = true;
                    playStopSound();
                } else if(activeTimeLeft <= 0) {
                    finishBlock();
                }
            }
            updateUI();
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            requestWakeLock();
            
            activeTimeLeft = ACTIVE_TIME_SEC;
            pauseTimeLeft = PAUSE_TIME_SEC;
            isFrozen = false;
            pauseTriggers = generatePauses();
            
            document.getElementById('start-btn').style.display = "none";
            document.getElementById('reward-display').innerText = "";
            
            updateUI();
            timerInterval = setInterval(tick, 1000);
        });
    </script>
</body>
</html>
