<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualiseringskort</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #03dac6;
            --pause-color: #ffb74d;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        
        #setup-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        #app-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            height: 100%;
            flex-grow: 1;
        }

        #cue-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 40px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.3;
        }

        #timer-display {
            font-size: 2rem;
            color: #888;
            font-variant-numeric: tabular-nums;
            margin-bottom: 30px;
        }

        select, button {
            background-color: #1e1e1e;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        button.primary {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
        }

        button.warning {
            background-color: var(--pause-color);
            color: #000;
            font-weight: bold;
            border: none;
            margin-top: 15px;
        }
        
        .paused {
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div id="setup-container">
        <h2>Visualiseringsrutine</h2>
        
        <select id="audio-select" onchange="updateBackgroundAudio()">
            <option value="none" selected>🔇 Lydløs (Ingen bakgrunnslyd)</option>
            <option value="white">📻 Hvit Støy</option>
            <option value="pink">🌸 Rosa Støy (Mykere enn hvit)</option>
            <option value="brown">🌊 Brun Støy (Dypest)</option>
        </select>

        <button class="primary" onclick="startSession()">Start Visualisering</button>
    </div>

    <div id="app-container">
        <div id="cue-display">Tema kommer her</div>
        <div id="timer-display">02:00</div>
        
        <div style="width: 100%; max-width: 300px;">
            <button id="pause-btn" class="warning" onclick="togglePause()">Pause</button>
            <button class="warning" style="background-color: transparent; border: 1px solid #555; color: #888;" onclick="stopSession()">Avslutt</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 🛠️ INNSTILLINGER: ENDRE TID OG TEMAER HER
        // ==========================================
        const SECONDS_PER_CUE = 120; // Tid per tema i sekunder (120 = 2 minutter)
        const WARNING_TIME = 10;     // Antall sekunder før slutt varsellyden spilles

        const cues = [
            "Jobb - Styringsdokumenter",
            "Jobb - Avleveringsplan",
            "Jobb - Produksjonsbase rutine",
            "Jobb - Anskaffe",
            "Løpe",
            "Øve",
            "Produsere",
            "Selge",
            "Hjem",
            "Fremtid"
        ];
        // ==========================================

        let currentCueIndex = 0;
        let timeLeft = SECONDS_PER_CUE;
        let isPaused = false;
        let timerInterval = null;
        let wakeLock = null;

        let audioCtx = null;
        let bgAudioNodes = []; 
        let bgGainNode = null;

        async function requestWakeLock() { 
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } 
            catch (err) {} 
        }
        function releaseWakeLock() { 
            if (wakeLock !== null) wakeLock.release().then(() => { wakeLock = null; }); 
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- LYDVARSLER ---
        function scheduleTone(freq, delay, duration, vol, type='sine') {
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, now + delay);
            
            gain.gain.setValueAtTime(0, now + delay);
            gain.gain.linearRampToValueAtTime(vol, now + delay + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, now + delay + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start(now + delay);
            osc.stop(now + delay + duration);
        }

        function playWarningSound() {
            // Myk og behagelig advarsel (10 sekunder igjen) - To dype toner
            scheduleTone(329.63, 0, 1.5, 0.1, 'sine'); // E4
            scheduleTone(261.63, 0.5, 2.0, 0.1, 'sine'); // C4
        }

        function playNextSound() {
            // Klar, oppløftende lyd for å åpne øynene - Tre lyse toner
            scheduleTone(440.00, 0, 1.0, 0.15, 'triangle'); // A4
            scheduleTone(554.37, 0.2, 1.0, 0.15, 'triangle'); // C#5
            scheduleTone(659.25, 0.4, 2.0, 0.15, 'triangle'); // E5
        }

        function playEndSound() {
            // Rolig avslutning
            scheduleTone(440.00, 0, 1.0, 0.1, 'sine');
            scheduleTone(329.63, 0.3, 1.5, 0.1, 'sine');
            scheduleTone(220.00, 0.6, 2.5, 0.1, 'sine');
        }

        // --- BAKGRUNNSSTØY ---
        function updateBackgroundAudio() {
            if (audioCtx) startBackgroundAudio(document.getElementById('audio-select').value);
        }

        function startBackgroundAudio(type) {
            stopBackgroundAudio();
            if (type === 'none') return;
            initAudio();
            
            bgGainNode = audioCtx.createGain();
            bgGainNode.connect(audioCtx.destination);

            let bufferSize = 2 * audioCtx.sampleRate;
            let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            let output = noiseBuffer.getChannelData(0);

            if (type === 'white') {
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                bgGainNode.gain.value = 0.03;
            } 
            else if (type === 'pink') {
                // Rosa støy (fokusert matematisk filter for å etterligne naturlig lyd)
                let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                    output[i] *= 0.11;
                    b6 = white * 0.115926;
                }
                bgGainNode.gain.value = 0.15;
            }
            else if (type === 'brown') {
                let lastOut = 0;
                for (let i = 0; i < bufferSize; i++) {
                    let white = Math.random() * 2 - 1;
                    output[i] = (lastOut + (0.02 * white)) / 1.02; 
                    lastOut = output[i];
                    output[i] *= 3.5; 
                }
                bgGainNode.gain.value = 0.4;
            }

            let noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;
            noiseSource.loop = true;
            noiseSource.connect(bgGainNode);
            noiseSource.start();
            bgAudioNodes.push(noiseSource);
        }

        function stopBackgroundAudio() {
            bgAudioNodes.forEach(node => { try { node.stop(); } catch(e){} });
            bgAudioNodes = [];
            if(bgGainNode) { bgGainNode.disconnect(); bgGainNode = null; }
        }

        // --- APP LOGIKK ---
        function formatTime(seconds) {
            let m = Math.floor(seconds / 60).toString().padStart(2, '0');
            let s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateUI() {
            document.getElementById('timer-display').innerText = formatTime(timeLeft);
            document.getElementById('cue-display').innerText = `${currentCueIndex + 1}. ${cues[currentCueIndex]}`;
            
            if (isPaused) document.getElementById('app-container').classList.add('paused');
            else document.getElementById('app-container').classList.remove('paused');
        }

        function startSession() {
            initAudio();
            requestWakeLock();
            
            currentCueIndex = 0;
            timeLeft = SECONDS_PER_CUE;
            isPaused = false;
            
            document.getElementById('setup-container').style.display = "none";
            document.getElementById('app-container').style.display = "flex";
            
            updateBackgroundAudio();
            updateUI();
            
            timerInterval = setInterval(tick, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            let pauseBtn = document.getElementById('pause-btn');
            
            if (isPaused) {
                clearInterval(timerInterval);
                releaseWakeLock();
                if (audioCtx && audioCtx.state === 'running') audioCtx.suspend();
                pauseBtn.innerText = "Gjenoppta";
                pauseBtn.style.backgroundColor = "var(--accent-color)";
            } else {
                requestWakeLock();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                pauseBtn.innerText = "Pause";
                pauseBtn.style.backgroundColor = "var(--pause-color)";
                timerInterval = setInterval(tick, 1000);
            }
            updateUI();
        }

        function stopSession() {
            clearInterval(timerInterval);
            releaseWakeLock();
            stopBackgroundAudio();
            
            document.getElementById('app-container').style.display = "none";
            document.getElementById('setup-container').style.display = "flex";
            
            let pauseBtn = document.getElementById('pause-btn');
            pauseBtn.innerText = "Pause";
            pauseBtn.style.backgroundColor = "var(--pause-color)";
        }

        function tick() {
            timeLeft--;
            
            if (timeLeft === WARNING_TIME) {
                playWarningSound(); // 10 sekunder før tiden er ute
            } 
            else if (timeLeft <= 0) {
                currentCueIndex++;
                
                if (currentCueIndex < cues.length) {
                    playNextSound(); // Lyd for å åpne øynene og lese neste
                    timeLeft = SECONDS_PER_CUE;
                } else {
                    playEndSound(); // Økten er helt ferdig
                    stopSession();
                    return;
                }
            }
            updateUI();
        }
    </script>
</body>
</html>
